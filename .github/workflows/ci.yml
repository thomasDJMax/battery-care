name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: battery-care-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show the Swift toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Build a release binary
        run: swift build -c release
